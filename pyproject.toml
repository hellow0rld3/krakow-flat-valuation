[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "krakow-flat-valuation"
version = "0.1.0"
description = "Hierarchical Bayesian flat valuation engine for Kraków"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cezary Szczepanek" }]

dependencies = [
    "numpyro>=0.21",
    "jax>=0.11",
    "numpy>=2.0",
    "pandas>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/hellow0rld3/krakow-flat-valuation"

# Makes `kfv` available as a command of its own, so the three subcommands can be
# run as `kfv fit` instead of `python -m kfv.cli fit`.
[project.scripts]
kfv = "kfv.cli:main"

# src layout: the package lives in src/kfv, not in the repository root.
[tool.setuptools.packages.find]
where = ["src"]
